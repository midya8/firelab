[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
[project]
name = "firelab-finite"
version = "0.1.0"
description = "Exact finite conservative Petri-net execution and independent evidence replay"
requires-python = ">=3.10"
license = {text="MIT"}
[project.scripts]
firelab = "firelab.__main__:main"
[tool.setuptools]
packages = ["firelab"]
